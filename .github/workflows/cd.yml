name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: cd-main
  # A running production mutation is not cancelled halfway through. Every
  # promotion boundary below revalidates both main HEAD and its latest CI run.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  verify-current-delivery:
    name: Reject superseded CI run
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.latest.outputs.is_latest }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | This is the newest successful main CI
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

  publish-device-candidate:
    name: Publish Raspberry Pi candidate image
    if: needs.verify-current-delivery.outputs.is_latest == 'true'
    needs:
      - verify-current-delivery
    runs-on: ubuntu-24.04-arm
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | Delivery is still current before image publish
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Setup | Log in to GHCR
        if: steps.latest.outputs.is_latest == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup | Buildx
        if: steps.latest.outputs.is_latest == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run | Build and publish ARM64 candidate image
        id: publish
        if: steps.latest.outputs.is_latest == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy Workers API (Blue/Green)
    if: needs.publish-device-candidate.outputs.published == 'true'
    needs:
      - publish-device-candidate
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.triggers.outcome == 'success' && steps.after_promote.outputs.is_latest == 'true' }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | Delivery is still current before API preparation
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Setup | Node.js development environment
        if: steps.prepare.outputs.is_latest == 'true'
        uses: ./.github/actions/setup-node

      - name: Run | Apply backward-compatible migrations
        if: steps.prepare.outputs.is_latest == 'true'
        run: pnpm run ci:migrate
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Upload green Worker version
        id: upload
        if: steps.prepare.outputs.is_latest == 'true'
        shell: bash
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version_tag="main-${DEPLOY_SHA:0:12}"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler versions upload src/index.ts \
            --preview-alias candidate \
            --tag "$version_tag" \
            --message "main ${DEPLOY_SHA}" \
            --minify
          version_id=$(pnpm exec wrangler versions list --json | jq -er \
            --arg tag "$version_tag" \
            'map(select(.annotations["workers/tag"] == $tag)) | sort_by(.metadata.created_on) | last | .id')
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify | Candidate health
        if: steps.prepare.outputs.is_latest == 'true'
        env:
          CANDIDATE_URL: https://candidate-room-manager.${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$CANDIDATE_URL"

      - name: Verify | Delivery is still current before API promotion
        id: promote_check
        if: steps.prepare.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Run | Promote green Worker to 100 percent
        id: promote
        if: steps.promote_check.outputs.is_latest == 'true'
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          pnpm exec wrangler versions deploy
          --version-id "$VERSION_ID"
          --percentage 100
          --message "main ${DEPLOY_SHA}"
          --yes

      - name: Verify | Delivery is still current after API promotion
        id: after_promote
        if: steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Run | Reconcile Worker triggers
        id: triggers
        if: steps.after_promote.outputs.is_latest == 'true'
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler triggers deploy

  promote-device-image:
    name: Promote Raspberry Pi image
    if: needs.deploy-api.outputs.deployed == 'true'
    needs:
      - deploy-api
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup | Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup | Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify | Delivery is still current before image promotion
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Run | Point main at the tested image
        if: steps.latest.outputs.is_latest == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:sha-$DEPLOY_SHA"
