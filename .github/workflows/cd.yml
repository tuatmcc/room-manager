name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: cd-main
  # A running production mutation is not cancelled halfway through. Every
  # promotion boundary below revalidates both main HEAD and its latest CI run.
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-current-delivery:
    name: Reject superseded CI run
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.latest.outputs.is_latest }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | This is the newest successful main CI
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

  build-device-binary:
    name: Build Raspberry Pi binary
    if: needs.verify-current-delivery.outputs.is_latest == 'true'
    needs:
      - verify-current-delivery
    runs-on: ubuntu-24.04-arm
    # Build on the same Debian release as the device so the binary only links
    # against the glibc and shared libraries that exist there.
    container:
      image: docker.io/library/rust:1.94.0-bookworm
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup | Install build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends libasound2-dev libusb-1.0-0-dev

      - name: Setup | Cache cargo store
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            /usr/local/cargo/registry
            target/
          key: device-binary-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            device-binary-${{ runner.arch }}-

      - name: Run | Build ARM64 binary
        id: build
        run: cargo build --locked --release --package room-manager

      - name: Verify | Binary starts
        run: ./target/release/room-manager --help > /dev/null

      - name: Upload | Binary candidate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: device-binary
          path: target/release/room-manager
          if-no-files-found: error
          retention-days: 7

  deploy-api:
    name: Deploy Workers API (Blue/Green)
    if: needs.build-device-binary.outputs.built == 'true'
    needs:
      - build-device-binary
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.triggers.outcome == 'success' && steps.after_promote.outputs.is_latest == 'true' }}
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | Delivery is still current before API preparation
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Setup | Node.js development environment
        if: steps.prepare.outputs.is_latest == 'true'
        uses: ./.github/actions/setup-node

      - name: Run | Apply backward-compatible migrations
        if: steps.prepare.outputs.is_latest == 'true'
        run: pnpm run ci:migrate
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Upload green Worker version
        id: upload
        if: steps.prepare.outputs.is_latest == 'true'
        shell: bash
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version_tag="main-${DEPLOY_SHA:0:12}"
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler versions upload src/index.ts \
            --preview-alias candidate \
            --tag "$version_tag" \
            --message "main ${DEPLOY_SHA}" \
            --minify
          version_id=$(pnpm exec wrangler versions list --json | jq -er \
            --arg tag "$version_tag" \
            'map(select(.annotations["workers/tag"] == $tag)) | sort_by(.metadata.created_on) | last | .id')
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify | Candidate health
        if: steps.prepare.outputs.is_latest == 'true'
        env:
          CANDIDATE_URL: https://candidate-${{ secrets.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "$CANDIDATE_URL"

      - name: Verify | Delivery is still current before API promotion
        id: promote_check
        if: steps.prepare.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Run | Promote green Worker to 100 percent
        id: promote
        if: steps.promote_check.outputs.is_latest == 'true'
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          pnpm exec wrangler versions deploy
          --version-id "$VERSION_ID"
          --percentage 100
          --message "main ${DEPLOY_SHA}"
          --yes

      - name: Verify | Delivery is still current after API promotion
        id: after_promote
        if: steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Run | Reconcile Worker triggers
        id: triggers
        if: steps.after_promote.outputs.is_latest == 'true'
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler triggers deploy

  publish-device-binary:
    name: Publish Raspberry Pi binary
    if: needs.deploy-api.outputs.deployed == 'true'
    needs:
      - deploy-api
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Setup | Checkout tested revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify | Delivery is still current before device publish
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: deploy/ci/check-latest-delivery.sh

      - name: Setup | Download binary candidate
        if: steps.latest.outputs.is_latest == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: device-binary
          path: device-binary

      - name: Run | Publish binary to the device-main release
        if: steps.latest.outputs.is_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          BINARY_PATH: device-binary/room-manager
        run: deploy/ci/publish-device-binary.sh
