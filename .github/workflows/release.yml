name: Release
on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: true
        description: "The tag name to release (e.g. `v0.1.0`)"

permissions:
  contents: write

jobs:
  release-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Rust development environment
        uses: ./.github/actions/setup-rust

      - name: Run | Build
        run: deploy/ci/build-native-arm64.sh

      - name: Run | Create ARM64 native artifact
        id: artifact
        run: |
          commit_sha=$(git rev-parse HEAD)
          artifact_dir="$RUNNER_TEMP/room-manager-release-artifact"
          artifact_path=$(deploy/native/create-artifact.sh "$commit_sha" target/release/room-manager "$artifact_dir")
          echo "artifact_path=$artifact_path" >>"$GITHUB_OUTPUT"

      - name: Run | Upload
        run: gh release upload ${{ inputs.tag_name }} target/release/room-manager "${{ steps.artifact.outputs.artifact_path }}" "${{ steps.artifact.outputs.artifact_path }}.sha256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
