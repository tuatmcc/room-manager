name: Release
on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: true
        description: "The tag name to release (e.g. `v0.1.0`)"

permissions:
  contents: write

jobs:
  release-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Rust development environment
        uses: ./.github/actions/setup-rust
        with:
          apt-packages: libasound2-dev libusb-1.0-0-dev

      - name: Run | Build
        run: cargo build -p room-manager --release --locked

      - name: Run | Upload
        run: gh release upload ${{ inputs.tag_name }} target/release/room-manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
