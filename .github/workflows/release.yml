name: Release
on:
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        type: string
        required: true
        description: "The tag name to release (e.g. `v0.1.0`)"
      deploy_api:
        type: boolean
        required: false
        default: false
        description: "Also run the Cloudflare API migration and deployment."
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  deploy-app:
    # Release Please calls this workflow directly; manually published releases run this asset build.
    if: ${{ github.event_name != 'release' || github.actor != 'tuatmcc-bot[bot]' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Setup | Rust development environment
        uses: ./.github/actions/setup-rust
        with:
          apt-packages: libasound2-dev libusb-1.0-0-dev

      - name: Run | Build
        run: cargo build -p room-manager --release --locked

      - name: Run | Upload
        run: gh release upload "$RELEASE_TAG" target/release/room-manager --clobber
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-api:
    if: ${{ github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.deploy_api == true) }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup | Node.js development environment
        uses: ./.github/actions/setup-node

      - name: Run | Migrate
        run: pnpm run ci:migrate
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run | Deploy
        run: pnpm run ci:deploy
        working-directory: packages/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
